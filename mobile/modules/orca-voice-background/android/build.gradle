apply plugin: 'com.android.library'

group = 'expo.modules.orcavoicebackground'
version = '0.0.1'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace 'expo.modules.orcavoicebackground'
  defaultConfig {
    // Keeps the Connect IQ SDK intact in minified release builds (consumer-rules.pro).
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // NotificationCompat/ContextCompat; already on the APK classpath through React Native.
  implementation 'androidx.core:core:1.13.1'
  // Orca's own Android Auto screens (OrcaCarApp.kt).
  implementation 'androidx.car.app:app:1.4.0'
  // Orca Remote on a Garmin watch's music controls (GarminRemote.kt).
  implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0@aar'
}
